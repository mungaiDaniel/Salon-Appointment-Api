# Run the API + PostgreSQL:  cp .env.example .env  (fill in SECRET_KEY and POSTGRES_PASSWORD)
#                            docker compose up --build
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_CONFIG: config.ProductionConfig
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URI: postgresql://${POSTGRES_USER:-salon_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-salon_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-salon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salon_user} -d ${POSTGRES_DB:-salon_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
